server.port=8080
server.address=0.0.0.0
management.endpoints.web.exposure.include=*

# Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:10.19.83.7:29092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.concurrency=1
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nhom4.xoxo.chat,com.nhom4.xoxo.dto,com.nhom4.xoxo.dto.req
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true


# Retry/DLT config (consumed by KafkaRetryConfig)
kafka.retry.delay-ms=3000
kafka.retry.max-attempts=5

# Mail topic
mail.topic=${MAIL_TOPIC:mail-topic}
notification.topic=${NOTIFICATION_TOPIC:notifications}


