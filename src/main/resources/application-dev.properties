# Development Configuration
# Chỉ dùng cho development, KHÔNG dùng cho production

# Server
server.port=8080
server.address=0.0.0.0

# JPA - Cho phép tạo table tự động trong development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway - Disable trong development để tránh conflict
spring.flyway.enabled=false

# Database - Development database
spring.datasource.url=jdbc:mysql://localhost:3306/xoxo_dev?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sapassword1


# Logging - Chi tiết hơn cho development
logging.level.com.nhom4.xoxo=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Kafka configuration (giữ nguyên từ main)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.nhom4.xoxo.dto,com.nhom4.xoxo.dto.req

# Mail topic
mail.topic=${MAIL_TOPIC:mail-topic}

# Mail configuration (giữ nguyên từ main)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:example@gmail.com}
spring.mail.password=${MAIL_PASS:your-mail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
fe.user.base-url=https://user.xoxo.com
fe.admin.base-url=https://admin.xoxo.com

# JWT Configuration (giữ nguyên từ main)
app.jwt-secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt-expiration-milliseconds=86400000

# OAuth2 Google Configuration (giữ nguyên từ main)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Logging configuration (giữ nguyên từ main)
spring.output.ansi.enabled=always
spring.output.ansi.console-available=true
logging.level.org.springframework.kafka=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %cyan(%logger{36}) - %msg%n

# CORS Configuration (giữ nguyên từ main)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Swagger/OpenAPI Configuration (giữ nguyên từ main)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Cloudinary Configuration (giữ nguyên từ main)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret} 