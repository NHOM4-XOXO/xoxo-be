<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Messenger WS Tester</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; }
    textarea,input,button { font-size: 14px; }
    .row { margin: 8px 0; }
    #log { border:1px solid #ccc; padding:8px; height:260px; overflow:auto; background:#fafafa; }
    label { display:inline-block; width:140px; }
  </style>
</head>
<body>
  <h2>Messenger WebSocket/STOMP Test</h2>

  <div class="row">
    <label>WS URL</label>
    <input id="wsUrl" value="https://xoxo.id.vn/ws" size="40"/>
  </div>
  <div class="row">
    <label>Authorization</label>
    <textarea id="token" rows="2" cols="70">Bearer ey...</textarea>
  </div>
  <div class="row">
    <label>Refresh Token</label>
    <textarea id="refreshToken" rows="2" cols="70" placeholder="Refresh token..."></textarea>
  </div>
  <div class="row">
    <label>Room ID</label>
    <input id="roomId" value="1" size="10"/>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
  </div>

  <h3>Subscriptions</h3>
  <div class="row">
    <button onclick="subRoom()">Subscribe Room (/topic/chat/{roomId})</button>
    <button onclick="unsubRoom()">Unsubscribe Room</button>
  </div>
  <div class="row">
    <button onclick="subPrivate()">Subscribe Private (/user/queue/private-message)</button>
    <button onclick="unsubPrivate()">Unsubscribe Private</button>
  </div>
  <div class="row">
    <button onclick="subTyping()">Subscribe Typing (/topic/chat/{roomId}/typing)</button>
    <button onclick="unsubTyping()">Unsubscribe Typing</button>
  </div>

  <h3>Send</h3>
  <div class="row">
    <label>Message</label>
    <input id="msg" placeholder="message..." size="40"/>
    <button onclick="sendText()">Send Text</button>
  </div>
  <div class="row">
    <button onclick="typingStart()">Typing Start</button>
    <button onclick="typingStop()">Typing Stop</button>
  </div>

  <h3>Log</h3>
  <pre id="log"></pre>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://unpkg.com/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script>
    let client, subRoomRef, subPrivateRef, subTypingRef;
    let tokenRefreshInterval;
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;
    
    const log = (m) => { const el = document.getElementById('log'); el.textContent += m + '\n'; el.scrollTop = el.scrollHeight; };

    function connect() {
      const wsUrl = document.getElementById('wsUrl').value.trim();
      const token = document.getElementById('token').value.trim();
      const useSockJS = wsUrl.startsWith('http');

      if (client && client.active) {
        log('Already connected.');
        return; 
      }

      client = new StompJs.Client({
        // For SockJS (recommended with HTTPS + self-signed), use webSocketFactory
        webSocketFactory: useSockJS ? () => new SockJS(wsUrl) : null,
        brokerURL: useSockJS ? undefined : wsUrl, // native ws if wss://.../ws-native
        connectHeaders: { Authorization: token },
        debug: (m) => log('[stomp] ' + m),
        reconnectDelay: 3000
      });

      client.onConnect = () => {
        log('Connected.');
        reconnectAttempts = 0; // Reset reconnect attempts on successful connection
        
        // Auto-subscribe to room after connection
        const roomId = document.getElementById('roomId').value.trim();
        if (roomId) {
          subRoomRef = client.subscribe(`/topic/chat/${roomId}`, msg => log('[room] ' + msg.body));
          subTypingRef = client.subscribe(`/topic/chat/${roomId}/typing`, msg => log('[typing] ' + msg.body));
          log(`Auto-subscribed to room ${roomId} and typing indicators`);
        }
        
        // Start token refresh timer
        startTokenRefresh();
      };
      
      client.onStompError = frame => {
        log('STOMP error: ' + frame.headers['message']);
        // If authentication error, try to refresh token
        if (frame.headers['message'] && frame.headers['message'].includes('authentication')) {
          handleAuthError();
        }
      };
      
      client.onWebSocketError = e => {
        log('WS error: ' + (e?.message || e));
        handleConnectionError();
      };
      
      client.activate();
    }

    function disconnect() {
      if (client) {
        try { subRoomRef?.unsubscribe(); } catch {}
        try { subPrivateRef?.unsubscribe(); } catch {}
        try { subTypingRef?.unsubscribe(); } catch {}
        stopTokenRefresh();
        client.deactivate().then(() => log('Disconnected.'));
      }
    }

    function subRoom() {
      const roomId = document.getElementById('roomId').value.trim();
      if (!client?.active) return log('Not connected.');
      subRoomRef = client.subscribe(`/topic/chat/${roomId}`, msg => log('[room] ' + msg.body));
      log(`Subscribed room ${roomId}`);
    }

    function unsubRoom() {
      try { subRoomRef?.unsubscribe(); log('Unsubscribed room'); } catch (e) { log('Unsub room err: ' + e); }
    }

    function subTyping() {
      const roomId = document.getElementById('roomId').value.trim();
      if (!client?.active) return log('Not connected.');
      subTypingRef = client.subscribe(`/topic/chat/${roomId}/typing`, msg => log('[typing] ' + msg.body));
      log(`Subscribed typing indicators for room ${roomId}`);
    }

    function unsubTyping() {
      try { subTypingRef?.unsubscribe(); log('Unsubscribed typing'); } catch (e) { log('Unsub typing err: ' + e); }
    }

    function subPrivate() {
      if (!client?.active) return log('Not connected.');
      subPrivateRef = client.subscribe('/user/queue/private-message', msg => log('[private] ' + msg.body));
      log('Subscribed private queue');
    }

    function unsubPrivate() {
      try { subPrivateRef?.unsubscribe(); log('Unsubscribed private'); } catch (e) { log('Unsub private err: ' + e); }
    }

    function sendText() {
      if (!client?.active) return log('Not connected.');
      const roomId = Number(document.getElementById('roomId').value.trim());
      const text = document.getElementById('msg').value;
      client.publish({
        destination: '/app/send-message',
        body: JSON.stringify({ chatRoomId: roomId, content: text, type: 'TEXT' })
      });
      log('Sent text to room ' + roomId);
    }

    function typingStart() {
      if (!client?.active) return log('Not connected.');
      const roomId = Number(document.getElementById('roomId').value.trim());
      client.publish({ destination: '/app/typing/start', body: JSON.stringify({ chatRoomId: roomId }) });
      log('Typing start');
    }

    function typingStop() {
      if (!client?.active) return log('Not connected.');
      const roomId = Number(document.getElementById('roomId').value.trim());
      client.publish({ destination: '/app/typing/stop', body: JSON.stringify({ chatRoomId: roomId }) });
      log('Typing stop');
    }

    // Token refresh logic
    function startTokenRefresh() {
      // Refresh token every 9 minutes (540 seconds) - before 10 minute expiry
      tokenRefreshInterval = setInterval(async () => {
        try {
          await refreshToken();
        } catch (error) {
          log('Token refresh failed: ' + error.message);
          handleAuthError();
        }
      }, 9 * 60 * 1000); // 9 minutes
    }

    function stopTokenRefresh() {
      if (tokenRefreshInterval) {
        clearInterval(tokenRefreshInterval);
        tokenRefreshInterval = null;
      }
    }

    async function refreshToken() {
      const refreshToken = document.getElementById('refreshToken').value.trim();
      if (!refreshToken) {
        throw new Error('No refresh token provided');
      }

      log('Refreshing token...');
      
      try {
        const response = await fetch('/api/auth/refresh-token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ refreshToken: refreshToken })
        });

        if (!response.ok) {
          throw new Error('Token refresh failed: ' + response.status);
        }

        const data = await response.json();
        const newToken = data.data.accessToken;
        const newRefreshToken = data.data.refreshToken;

        // Update tokens in UI
        document.getElementById('token').value = 'Bearer ' + newToken;
        if (newRefreshToken) {
          document.getElementById('refreshToken').value = newRefreshToken;
        }

        // Update WebSocket connection headers
        if (client && client.active) {
          client.connectHeaders = { Authorization: 'Bearer ' + newToken };
          log('Token updated in WebSocket connection');
        }

        log('Token refreshed successfully');
      } catch (error) {
        log('Token refresh error: ' + error.message);
        throw error;
      }
    }

    function handleAuthError() {
      log('Authentication error detected. Attempting to refresh token...');
      refreshToken().then(() => {
        log('Token refreshed. Reconnecting...');
        reconnect();
      }).catch(() => {
        log('Token refresh failed. Please login again.');
        disconnect();
      });
    }

    function handleConnectionError() {
      if (reconnectAttempts < maxReconnectAttempts) {
        reconnectAttempts++;
        log(`Connection lost. Attempting to reconnect (${reconnectAttempts}/${maxReconnectAttempts})...`);
        setTimeout(() => {
          connect();
        }, 3000 * reconnectAttempts); // Exponential backoff
      } else {
        log('Max reconnection attempts reached. Please refresh the page.');
      }
    }

    function reconnect() {
      if (client) {
        client.deactivate().then(() => {
          setTimeout(() => {
            connect();
          }, 1000);
        });
      }
    }

    // Auto-connect on page load if tokens are available
    window.addEventListener('load', () => {
      const token = document.getElementById('token').value.trim();
      const refreshToken = document.getElementById('refreshToken').value.trim();
      if (token && refreshToken) {
        log('Auto-connecting...');
        connect();
      }
    });
  </script>
</body>
</html>
